<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="../../CSS/auth/register.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container" id="main-content">
        <div id="loading-screen"></div>

        <div class="form-box">
            <div class="title-container">
                <div class="line left"></div>
                <h1>Crear Cuenta</h1>
                <div class="line right"></div>
            </div>
            <p>¡Bienvenido! Por favor, completa los siguientes campos para crear tu cuenta:</p>
            <form id="registerForm">
                <div class="input-group">
                    <input type="text" id="nombre" placeholder="Nombre" required />
                    <input type="text" id="apellido_paterno" placeholder="Apellido Paterno" required />
                </div>
                <div class="input-group">
                    <input type="text" id="apellido_materno" placeholder="Apellido Materno" required />
                    <select id="id_cargo" required>
                        <option value="">Rol</option>
                        <option value="1">Alumno</option>
                        <option value="2">Personal</option>
                        <option value="3">Administrador</option>
                    </select>
                </div>
                <div class="input-group">
                    <input type="password" id="contraseña" placeholder="Contraseña" required />
                </div>
                <div class="input-group">
                    <input type="password" id="contraseña_confirm" placeholder="Verificar Contraseña" required />
                </div>
                <p id="error-msg" style="color:red; font-size:13px; display:none;"></p>
                <p id="success-msg" style="color:green; font-size:13px; display:none;"></p>
                <button type="submit" id="btn-crear">CREAR</button>
            </form>
            <button class="registro-btn" onclick="window.location.href='../auth/login.html'">Regresar</button>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8001';

        window.addEventListener("load", () => {
            const loading = document.getElementById("loading-screen");
            loading.classList.add("slide-away");
            setTimeout(() => { loading.style.display = "none"; }, 1500);
        });

        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const apellido_paterno = document.getElementById('apellido_paterno').value.trim();
            const apellido_materno = document.getElementById('apellido_materno').value.trim();
            const id_cargo = parseInt(document.getElementById('id_cargo').value);
            const contraseña = document.getElementById('contraseña').value;
            const contraseña_confirm = document.getElementById('contraseña_confirm').value;

            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            const btn = document.getElementById('btn-crear');

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            if (contraseña !== contraseña_confirm) {
                errorMsg.textContent = 'Las contraseñas no coinciden.';
                errorMsg.style.display = 'block';
                return;
            }

            if (!id_cargo) {
                errorMsg.textContent = 'Selecciona un rol.';
                errorMsg.style.display = 'block';
                return;
            }

            btn.textContent = 'Creando...';
            btn.disabled = true;

            try {
                const response = await fetch(`${BASE_URL}/usuarios/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, apellido_paterno, apellido_materno, contraseña, id_cargo })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Error al crear la cuenta');
                }

                successMsg.textContent = `Cuenta creada. Tu usuario es: ${data.usuario}`;
                successMsg.style.display = 'block';

                setTimeout(() => {
                    window.location.href = '../auth/login.html';
                }, 2500);
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
            } finally {
                btn.textContent = 'CREAR';
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
